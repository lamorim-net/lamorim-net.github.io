title: Luiz Amorim
author: Luiz Amorim
email: hello.luiz@icloud.com
lang: en
url: https://lamorim.net
baseurl: ""
description: >-
  Personal site of Luiz Amorim — product, marketing, and technology. Notes, blueprint, and writing.

permalink: /:slug.html

favicon: "favicon.png"

remote_theme: riggraz/no-style-please

twitter:
  username: lamorim_net
  card: summary

social:
  name: Luiz Amorim
  links:
    - https://x.com/lamorim_net
    - https://github.com/lamorim-net
    - https://www.linkedin.com/in/luizamorim/
    - https://lamorim.net

theme_config:
  appearance: "auto"
  back_home_text: "Home"
  date_format: "%Y-%m-%d"
  show_description: false
  lowercase_titles: true

sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jektex

jektex:
  cache_dir: ".jektex-cache"
  ignore: ["*.xml"]
  silent: false
  macros:
    - ["\Q", "\mathbb{Q}"]
    - ["\C", "\mathbb{C}"]
